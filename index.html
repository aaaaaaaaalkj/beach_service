<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Beach Volleyball Serve Simulation</title>
    <link rel="icon" href="data:,">
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #f0f0f0; display: flex; height: 100vh; overflow: hidden; /* Prevent body scroll */ }
        #container { flex-grow: 1; position: relative; overflow: hidden; } /* Make canvas container flexible */
        #controls {
            width: 360px;
            min-width: 320px;
            padding: 10px 15px;
            background-color: #ffffff;
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
            overflow-y: auto; /* Enable scroll ONLY if needed */
            overflow-x: hidden; /* Prevent horizontal scrollbar during transition */
            border-left: 1px solid #ccc;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column; /* Stack elements vertically */
            transition: width 0.35s ease-in-out,
                        min-width 0.35s ease-in-out,
                        padding 0.35s ease-in-out,
                        opacity 0.35s ease-in-out;
        }
        fieldset {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 8px 10px 10px 10px;
            margin: 0 0 10px 0;
        }
        fieldset:disabled { opacity: 0.6; }
        legend { font-weight: bold; padding: 0 5px; font-size: 0.95em; color: #333; }
        label { display: block; margin-bottom: 3px; font-weight: bold; font-size: 0.9em; }
        input[type="range"] { width: calc(100% - 10px); margin-top: -2px; /* Pull closer to label */ }
        button { padding: 8px 12px; margin-top: 5px; cursor: pointer; background-color: #e0e0e0; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9em; }
        button:hover:not(:disabled) { background-color: #d5d5d5; }
        button:disabled { cursor: not-allowed; color: #888; }
        #serveButton {
            background-color: #4CAF50; color: white; font-size: 1.1em; border: none; border-radius: 5px; width: 100%;
            padding: 10px;
            margin: 5px 0 10px 0;
            transition: background-color 0.3s;
        }
        #serveButton:hover:not(:disabled) { background-color: #45a049; }
        #serveButton:disabled { background-color: #cccccc; color: #666666; }
        .hint { font-size: 0.8em; color: #666; font-weight: normal; }
        .hidden { display: none; }
        select, input[type="radio"], input[type="checkbox"] { margin-bottom: 5px; }
        input[type="radio"] + label { display: inline; font-weight: normal; margin-right: 10px; } /* Inline radio labels */
        .value-display { font-weight: normal; color: #555; margin-left: 8px; font-size: 0.95em; }
        .camera-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 4px; }
        .camera-buttons button { margin: 0; padding: 5px 2px; font-size: 0.8em; }
        .inline-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .inline-row select { flex-grow: 1; margin-bottom: 0; }
        #ballCamOption label { display: inline; font-weight: normal; }

        /* --- Results --- */
        #results {
            background-color: #f5f5f5;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
        }
        #results h3 { margin: 0 0 6px 0; font-size: 1em; text-align: center; border-bottom: 1px solid #e3e3e3; padding-bottom: 4px; }
        #results .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
        #results p { margin: 0; font-size: 0.85em; display: flex; justify-content: space-between; }
        #results p.wide { grid-column: 1 / -1; }
        #results .val { font-weight: bold; color: #2a6496; }
        #resultClassification.in { color: #2e7d32; }
        #resultClassification.fault { color: #c62828; }

        /* --- Save/Load Slots --- */
        #saveLoad {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 2px 6px;
            align-items: center;
        }
        #saveLoad .slot-label { font-weight: bold; font-size: 0.85em; color: #333; }
        #saveLoad .slot-summary { font-size: 0.8em; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #saveLoad .slot-summary.empty { color: #aaa; font-style: italic; }
        #saveLoad button { padding: 2px 10px; font-size: 0.8em; margin: 0; }
        #saveStatus { font-size: 0.8em; color: #2e7d32; margin-top: 4px; }
        #saveStatus:empty { display: none; }
        #saveStatus.error { color: #c62828; }

        /* --- Collapsible Controls --- */
        #toggleControlsButton {
            position: fixed; /* Keep it visible even when scrolling */
            top: 10px;
            right: 10px;
            z-index: 1000;
            padding: 8px 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2em;
            line-height: 1;
            margin: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.3s, transform 0.3s, right 0.35s ease-in-out;
        }
        /* While the panel is open, keep the floating buttons over the canvas, left of the panel */
        #controls:not(.collapsed) ~ #toggleControlsButton { right: 370px; }
        #controls:not(.collapsed) ~ #quickServeButton { right: 415px; }
        #toggleControlsButton:hover { background-color: rgba(0, 0, 0, 0.8); transform: scale(1.05); }
        #controls.collapsed {
            width: 0;
            min-width: 0;
            padding-left: 0;
            padding-right: 0;
            opacity: 0;
            overflow-y: hidden;
            border-left: none;
        }

        /* --- Quick Serve Button --- */
        #quickServeButton {
            position: fixed;
            top: 10px;
            right: 55px; /* Left of the toggle button */
            z-index: 1000;
            padding: 8px 12px;
            margin: 0;
            font-size: 0.9em;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.3s, right 0.35s ease-in-out;
        }
        #quickServeButton:hover:not(:disabled) { background-color: #45a049; }
        #quickServeButton:disabled { background-color: #cccccc; color: #666666; }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="controls">
        <fieldset id="basicsFieldset">
            <legend>Serve Basics</legend>
            <div class="inline-row">
                <input type="radio" id="genderMale" name="gender" value="male" checked> <label for="genderMale">Men</label>
                <input type="radio" id="genderFemale" name="gender" value="female"> <label for="genderFemale">Women</label>
                <select id="launchPosition" aria-label="Launch Position">
                    <option value="center">Center Baseline</option>
                    <option value="leftCorner">Left Corner</option>
                    <option value="rightCorner">Right Corner</option>
                </select>
            </div>
            <div>
                <label for="contactHeight">Contact Height: <span id="contactHeightValue" class="value-display">2.20 m</span></label>
                <input type="range" id="contactHeight" min="1.8" max="3.6" value="2.2" step="0.05">
            </div>
        </fieldset>

        <fieldset id="launchFieldset">
            <legend>Launch Parameters</legend>
            <div>
                <label for="launchSpeed">Speed: <span id="launchSpeedValue" class="value-display">15.0 m/s</span></label>
                <input type="range" id="launchSpeed" min="5" max="30" value="15" step="0.5">
            </div>
            <div>
                <label for="verticalAngle">Vertical Angle: <span id="verticalAngleValue" class="value-display">20 °</span></label>
                <input type="range" id="verticalAngle" min="1" max="89" value="20" step="1">
            </div>
            <div>
                <label for="horizontalAngle">Horizontal Angle: <span id="horizontalAngleValue" class="value-display">0 °</span> <span class="hint">(- Left / + Right)</span></label>
                <input type="range" id="horizontalAngle" min="-45" max="45" value="0" step="1">
            </div>
            <div>
                <label for="spin">Spin: <span id="spinValue" class="value-display">0.0 rev/s (float)</span> <span class="hint">(- Back / + Top)</span></label>
                <input type="range" id="spin" min="-5" max="15" value="0" step="0.5">
            </div>
        </fieldset>

        <fieldset id="environmentFieldset">
            <legend>Environment</legend>
            <label for="enableWind">
                <input type="checkbox" id="enableWind"> Enable Wind
            </label>
            <div id="windControls" class="hidden">
                <label for="windStrength">Speed: <span id="windStrengthValue" class="value-display">3.0 m/s</span></label>
                <input type="range" id="windStrength" min="0" max="10" value="3" step="0.5">
                <label for="windDirection">Blowing Towards: <span id="windDirectionValue" class="value-display">0 °</span> <span class="hint">(0° = Net, 90° = Right)</span></label>
                <input type="range" id="windDirection" min="0" max="359" value="0" step="1">
            </div>
        </fieldset>

        <fieldset id="cameraFieldset">
            <legend>Camera</legend>
            <div class="camera-buttons">
                <button id="camBehind" title="Behind Server">Behind</button>
                <button id="camBaselineSide" title="Baseline Side">Baseline</button>
                <button id="camCourtSide" title="Court Side">Side</button>
                <button id="camTop" title="Top View">Top</button>
            </div>
            <div id="ballCamOption">
                <input type="checkbox" id="enableBallCam">
                <label for="enableBallCam">Ball's Eye</label>
            </div>
        </fieldset>

        <button id="serveButton">Serve!</button>

        <div id="results">
            <h3>Results</h3>
            <div class="grid">
                <p class="wide"><span>Classification:</span><span id="resultClassification" class="val">-</span></p>
                <p class="wide"><span id="resultSpeedLabel">Landing Speed:</span><span id="resultFinalSpeed" class="val">- m/s</span></p>
                <p><span>Flight Time:</span><span id="resultFlightTime" class="val">- s</span></p>
                <p><span>Difficulty:</span><span id="resultDifficulty" class="val">- / 100</span></p>
            </div>
        </div>

        <fieldset id="saveLoadFieldset" style="margin-top: auto;"> <!-- Push save/load towards bottom -->
            <legend>Save/Load Settings</legend>
            <div id="saveLoad">
                <!-- Save/Load slots will be generated here -->
            </div>
            <div id="saveStatus" role="status"></div>
        </fieldset>

        <div id="attribution" style="font-size: 0.7em; color: #666; padding-top: 6px; border-top: 1px solid #eee; line-height: 1.35;">
            Sand texture <a href="https://www.the3rdsequence.com/texturedb/texture/43/smooth+sand+dunes/" target="_blank" rel="noopener noreferrer">"Smooth sand dunes"</a>
            by the3rdSequence,
            <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>;
            resized to 1024×1024 and recompressed.
        </div>
    </div>

    <!-- Toggle Button (after #controls) -->
    <button id="toggleControlsButton" aria-label="Toggle Settings Panel" aria-expanded="true">
        ⚙️
    </button>
    <!-- Quick Serve Button (after #controls) -->
    <button id="quickServeButton" aria-label="Serve the ball">Serve</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            },
            "integrity": {
                "https://unpkg.com/three@0.160.0/build/three.module.js": "sha384-61S/Nu32S3E5+n+KpCOTb2eRYps6fVKm+9Gz1QBvSePFthb46f063Aa/qe/lykFZ",
                "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js": "sha384-qlO/ZugKPxAQUAvTlQoo0QECzxJIJySZmCF/DHdb2Xn/hHndFwX/vfUAC9Hbk6LP"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Constants ---
        const COURT_WIDTH = 8; // meters
        const COURT_LENGTH = 16; // meters
        const NET_HEIGHT_MEN = 2.43;
        const NET_HEIGHT_WOMEN = 2.24;
        const NET_LENGTH = 8.5; // FIVB beach net length
        const POLE_HEIGHT = 3.0;
        const POLE_RADIUS = 0.05;
        const POLE_OFFSET = 0.8; // Distance of the poles from the sidelines (FIVB: 0.70 - 1.00 m)
        const POLE_DISTANCE = COURT_WIDTH + 2 * POLE_OFFSET;
        const ANTENNA_HEIGHT = 0.8; // Above net top band
        const ANTENNA_RADIUS = 0.005; // 10 mm diameter
        const BALL_RADIUS = 0.1083; // FIVB beach ball circumference 66-68 cm
        const BALL_MASS = 0.27; // kg (average)
        const GRAVITY = 9.81; // m/s^2
        const AIR_DENSITY = 1.225; // kg/m^3
        const DRAG_COEFFICIENT = 0.45; // Typical measured volleyball value at serve speeds (subcritical regime)
        const BALL_AREA = Math.PI * BALL_RADIUS * BALL_RADIUS; // Cross-sectional area
        const NUM_SAVE_SLOTS = 5;
        const NET_VISUAL_HEIGHT = 1.0; // Height of the net mesh itself
        const NET_BAND_HEIGHT = 0.07;  // Height of the top/bottom white bands
        const CONTACT_HEIGHT_MEN = 2.2;   // Default ball center height at contact
        const CONTACT_HEIGHT_WOMEN = 2.0;

        // Physics integration (fixed step => identical results at any frame rate)
        const PHYSICS_DT = 0.001; // s
        const MAX_FRAME_DELTA = 0.1; // s, cap per rendered frame to avoid a spiral of death
        const MAX_FLIGHT_TIME = 10; // s, safety stop

        // Net tape interaction
        const COR_NET_TAPE = 0.3;       // Coefficient of restitution of the tape (normal direction)
        const TAPE_FRICTION = 0.4;      // Coulomb friction coefficient at the tape
        const MIN_BOUNCE_SPEED = 0.2;   // Below this normal speed, contacts are treated as resting (no bounce)

        // Typical reception positions on the opponent's side (two receivers)
        const RECEIVER_POSITIONS = [
            new THREE.Vector3(COURT_LENGTH * 0.3, 0, COURT_WIDTH * 0.25),
            new THREE.Vector3(COURT_LENGTH * 0.3, 0, -COURT_WIDTH * 0.25),
        ];

        // Ball Cam Constants
        const BALL_CAM_END_DELAY = 1000; // Delay in milliseconds after landing
        const BALL_CAM_TRANSITION_SPEED = 0.07; // Lerp factor per 1/60 s
        const BALL_CAM_FOLLOW_SPEED = 0.1;      // Lerp factor per 1/60 s

        const UP = new THREE.Vector3(0, 1, 0);

        // --- Global Variables ---
        let scene, camera, renderer, controls;
        let ground, net, poles = [], antennas = [], antennaHolders = [], ball;
        let netTopBand, netBottomBand, netCables;
        let holderMaterial;
        let serveArrow, windArrow1, windArrow2;
        let trajectoryLine = null;
        let ballPosition = new THREE.Vector3();
        let ballVelocity = new THREE.Vector3();
        let windVelocity = new THREE.Vector3();
        let spinAxis = new THREE.Vector3();
        let spinRate = 0; // rad/s
        let trajectoryPoints = [];
        let isSimulating = false;
        let simTime = 0;
        let physicsAccumulator = 0;
        let crossedNet = false;
        let touchedTape = false;
        let pendingFault = null; // Fault detected at the net plane; the flight continues until landing
        const prevBallPosition = new THREE.Vector3();

        let currentNetHeight = NET_HEIGHT_MEN;
        let currentServePosition = new THREE.Vector3();

        // Ball Cam State
        let ballCamInUse = false;           // Is ball cam *currently controlling* the camera?
        let isTransitioningToBallCam = false;
        let isWaitingAfterBallCam = false;
        let isTransitioningFromBallCam = false;
        let ballCamEndTime = 0;
        const preBallCamPosition = new THREE.Vector3(); // Saved camera state
        const preBallCamTarget = new THREE.Vector3();   // Saved controls target
        const targetBallCamPos = new THREE.Vector3();     // Target for initial transition
        const targetBallCamLookAt = new THREE.Vector3();  // Target lookAt for initial transition

        const textureLoader = new THREE.TextureLoader();
        const clock = new THREE.Clock();

        let dynamicAntennaTexture;
        let dynamicAntennaMaterial;
        let dynamicNetTexture;
        let dynamicNetMaterial;

        // Frame-rate independent lerp factor (factor is defined per 1/60 s)
        function frameLerp(factor, deltaTime) {
            return 1 - Math.pow(1 - factor, deltaTime * 60);
        }

        // --- Dynamic Antenna Texture Generation ---
        function createDynamicAntennaTexture() {
            const canvas = document.createElement('canvas');
            const canvasSize = 64;
            canvas.width = 1; // Width doesn't matter for horizontal stripes
            canvas.height = canvasSize;
            const ctx = canvas.getContext('2d');

            const bandHeight = canvasSize / 2; // Half canvas for red, half for white
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, bandHeight, canvas.width, bandHeight);
            ctx.fillStyle = '#ff3030';
            ctx.fillRect(0, 0, canvas.width, bandHeight);

            dynamicAntennaTexture = new THREE.CanvasTexture(canvas);
            dynamicAntennaTexture.colorSpace = THREE.SRGBColorSpace;
            dynamicAntennaTexture.wrapS = THREE.RepeatWrapping;
            dynamicAntennaTexture.wrapT = THREE.RepeatWrapping; // Repeat vertically
            dynamicAntennaTexture.needsUpdate = true;

            dynamicAntennaMaterial = new THREE.MeshStandardMaterial({
                map: dynamicAntennaTexture,
                roughness: 0.8,
                metalness: 0.1
            });
        }

        // --- Dynamic Net Texture Generation ---
        function createDynamicNetTexture(options = {}) {
            const defaults = {
                canvasSize: 64,
                lineWidth: 2,
                lineColor: '#ffffff', // Color to draw the lines
                materialColor: 0xffffff, // Base color of the mesh material
                alphaTestValue: 0.5,
                roughness: 0.8,
                metalness: 0.1
            };
            const config = { ...defaults, ...options };

            const canvas = document.createElement('canvas');
            canvas.width = config.canvasSize;
            canvas.height = config.canvasSize;
            const ctx = canvas.getContext('2d');

            // Background is transparent by default. We just draw the opaque parts (cords).
            const center = config.canvasSize / 2;

            // Shadow line (darker, slightly offset down/right)
            ctx.strokeStyle = '#555555';
            ctx.lineWidth = config.lineWidth;
            ctx.beginPath();
            ctx.moveTo(0, center + 1); ctx.lineTo(config.canvasSize, center + 1);
            ctx.moveTo(center + 1, 0); ctx.lineTo(center + 1, config.canvasSize);
            ctx.stroke();

            // Main line
            ctx.strokeStyle = config.lineColor;
            ctx.lineWidth = config.lineWidth * 0.8;
            ctx.beginPath();
            ctx.moveTo(0, center); ctx.lineTo(config.canvasSize, center);
            ctx.moveTo(center, 0); ctx.lineTo(center, config.canvasSize);
            ctx.stroke();

            // Highlight line (brightest, slightly offset up/left)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = config.lineWidth * 0.3;
            ctx.beginPath();
            ctx.moveTo(0, center - 1); ctx.lineTo(config.canvasSize, center - 1);
            ctx.moveTo(center - 1, 0); ctx.lineTo(center - 1, config.canvasSize);
            ctx.stroke();

            if (dynamicNetTexture) dynamicNetTexture.dispose();
            dynamicNetTexture = new THREE.CanvasTexture(canvas);
            dynamicNetTexture.colorSpace = THREE.SRGBColorSpace;
            dynamicNetTexture.wrapS = THREE.RepeatWrapping;
            dynamicNetTexture.wrapT = THREE.RepeatWrapping;
            // Note: The number of repeats is set later based on net dimensions
            dynamicNetTexture.needsUpdate = true;

            if (dynamicNetMaterial) dynamicNetMaterial.dispose();
            dynamicNetMaterial = new THREE.MeshStandardMaterial({
                alphaMap: dynamicNetTexture, // Lines = opaque, empty = transparent
                color: config.materialColor,
                roughness: config.roughness,
                metalness: config.metalness,
                transparent: true,
                side: THREE.DoubleSide,     // Net should be visible from both sides
                alphaTest: config.alphaTestValue, // Discard pixels below this alpha for sharp holes
            });
            return dynamicNetMaterial;
        }

        createDynamicAntennaTexture();

        // --- DOM Elements ---
        const container = document.getElementById('container');
        const controlsDiv = document.getElementById('controls');
        const toggleControlsButton = document.getElementById('toggleControlsButton');
        const genderMaleRadio = document.getElementById('genderMale');
        const genderFemaleRadio = document.getElementById('genderFemale');
        const launchPositionSelect = document.getElementById('launchPosition');
        const contactHeightSlider = document.getElementById('contactHeight');
        const contactHeightValue = document.getElementById('contactHeightValue');
        const launchSpeedSlider = document.getElementById('launchSpeed');
        const launchSpeedValue = document.getElementById('launchSpeedValue');
        const verticalAngleSlider = document.getElementById('verticalAngle');
        const verticalAngleValue = document.getElementById('verticalAngleValue');
        const horizontalAngleSlider = document.getElementById('horizontalAngle');
        const horizontalAngleValue = document.getElementById('horizontalAngleValue');
        const spinSlider = document.getElementById('spin');
        const spinValue = document.getElementById('spinValue');
        const serveButton = document.getElementById('serveButton');
        const quickServeButton = document.getElementById('quickServeButton');
        const enableWindCheckbox = document.getElementById('enableWind');
        const windControlsDiv = document.getElementById('windControls');
        const windStrengthSlider = document.getElementById('windStrength');
        const windStrengthValue = document.getElementById('windStrengthValue');
        const windDirectionSlider = document.getElementById('windDirection');
        const windDirectionValue = document.getElementById('windDirectionValue');
        const resultClassification = document.getElementById('resultClassification');
        const resultSpeedLabel = document.getElementById('resultSpeedLabel');
        const resultFinalSpeed = document.getElementById('resultFinalSpeed');
        const resultFlightTime = document.getElementById('resultFlightTime');
        const resultDifficulty = document.getElementById('resultDifficulty');
        const camBehindButton = document.getElementById('camBehind');
        const camBaselineSideButton = document.getElementById('camBaselineSide');
        const camCourtSideButton = document.getElementById('camCourtSide');
        const camTopButton = document.getElementById('camTop');
        const enableBallCamCheckbox = document.getElementById('enableBallCam');
        const saveLoadDiv = document.getElementById('saveLoad');
        const saveStatus = document.getElementById('saveStatus');
        const settingsFieldsets = ['basicsFieldset', 'launchFieldset', 'environmentFieldset', 'saveLoadFieldset']
            .map(id => document.getElementById(id));
        const cameraFieldset = document.getElementById('cameraFieldset');

        // --- Sand Texture Loading ---
        const sandTexture = textureLoader.load(
            'sand.jpg',
            (texture) => {
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                const groundWidthUnits = COURT_WIDTH * 2.2;
                const groundLengthUnits = COURT_LENGTH * 1.5;
                texture.repeat.set(groundLengthUnits / 2, groundWidthUnits / 2); // Repeat every 2 meters
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.needsUpdate = true;
                if (ground) ground.material.needsUpdate = true;
            },
            undefined,
            (err) => console.error('An error happened loading the sand texture:', err)
        );

        // --- Volleyball Texture Loading ---
        const ballTexture = textureLoader.load(
            'beachvolleyball.png',
            (texture) => {
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                if (ball) ball.material.needsUpdate = true;
            },
            undefined,
            (err) => console.error('Failed to load volleyball texture:', err)
        );

        // --- Initialization ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 1, 0);
            controls.minDistance = 1.5; // Prevent zooming too close
            controls.maxDistance = COURT_LENGTH * 2.5; // Limit zoom out based on court size
            controls.maxPolarAngle = (90 + 2) * Math.PI / 180; // Allow looking slightly upwards from ground level (92°)
            controls.minPolarAngle = 0.1; // (~6 degrees from pure vertical 'up')

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
            directionalLight.position.set(15, 25, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            directionalLight.shadow.camera.near = 1;
            directionalLight.shadow.camera.far = 60;
            directionalLight.shadow.camera.left = -COURT_LENGTH * 1.1;
            directionalLight.shadow.camera.right = COURT_LENGTH * 1.1;
            directionalLight.shadow.camera.top = COURT_WIDTH * 2.5;
            directionalLight.shadow.camera.bottom = -COURT_WIDTH * 2.5;
            scene.add(directionalLight);

            createCourt();
            createBall();
            createHelpers();

            setupUIListeners();
            checkScreenSizeAndCollapse(); // Collapse controls on load for small screens
            generateSaveLoadButtons();

            updateNetHeight();
            updateServePosition();
            updateWindVisualization();
            resetResults();
            setCameraPosition('behind');
            updateUIState();

            animate();

            // Resize the canvas whenever its container changes size (window resize or panel collapse)
            new ResizeObserver(onWindowResize).observe(container);
            window.addEventListener('resize', checkScreenSizeAndCollapse);
        }

        // --- Create Scene Objects ---
        function createCourt() {
            // Ground (Sand)
            const groundGeometry = new THREE.PlaneGeometry(COURT_LENGTH * 1.5, COURT_WIDTH * 2.2);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0xEEDC82, // Tint applied to the sand texture
                map: sandTexture,
                side: THREE.DoubleSide,
                roughness: 1,
                metalness: 0.0,
            });
            ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = 0;
            ground.receiveShadow = true;
            scene.add(ground);

            // Court Lines (lines are part of the court: their outer edges are the boundary)
            const lineMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const LINE_HEIGHT = 0.01;
            const LINE_THICKNESS = 0.05;

            function createLineBox(width, depth) {
                const geometry = new THREE.BoxGeometry(width, LINE_HEIGHT, depth);
                const mesh = new THREE.Mesh(geometry, lineMaterial);
                mesh.receiveShadow = true;
                return mesh;
            }
            const sideLineL = createLineBox(COURT_LENGTH, LINE_THICKNESS);
            sideLineL.position.set(0, LINE_HEIGHT / 2, COURT_WIDTH / 2 - LINE_THICKNESS / 2);
            scene.add(sideLineL);
            const sideLineR = createLineBox(COURT_LENGTH, LINE_THICKNESS);
            sideLineR.position.set(0, LINE_HEIGHT / 2, -COURT_WIDTH / 2 + LINE_THICKNESS / 2);
            scene.add(sideLineR);
            const baseLineBack = createLineBox(LINE_THICKNESS, COURT_WIDTH);
            baseLineBack.position.set(-COURT_LENGTH / 2 + LINE_THICKNESS / 2, LINE_HEIGHT / 2, 0);
            scene.add(baseLineBack);
            const baseLineFront = createLineBox(LINE_THICKNESS, COURT_WIDTH);
            baseLineFront.position.set(COURT_LENGTH / 2 - LINE_THICKNESS / 2, LINE_HEIGHT / 2, 0);
            scene.add(baseLineFront);
            const centerLine = createLineBox(LINE_THICKNESS, COURT_WIDTH);
            centerLine.position.set(0, LINE_HEIGHT / 2, 0);
            scene.add(centerLine);

            // Poles
            const poleGeometry = new THREE.CylinderGeometry(POLE_RADIUS, POLE_RADIUS, POLE_HEIGHT, 16);
            const poleMaterial = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.6, roughness: 0.5 });
            holderMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.7,
                metalness: 0.1,
                polygonOffset: true, // Avoid z-fighting with the antenna
                polygonOffsetFactor: -0.5,
                polygonOffsetUnits: -1.0
            });
            poles[0] = new THREE.Mesh(poleGeometry, poleMaterial);
            poles[0].position.set(0, POLE_HEIGHT / 2, POLE_DISTANCE / 2);
            poles[0].castShadow = true;
            scene.add(poles[0]);
            poles[1] = new THREE.Mesh(poleGeometry, poleMaterial);
            poles[1].position.set(0, POLE_HEIGHT / 2, -POLE_DISTANCE / 2);
            poles[1].castShadow = true;
            scene.add(poles[1]);

            // Net Mesh
            const netGeometry = new THREE.PlaneGeometry(NET_LENGTH, NET_VISUAL_HEIGHT);
            const netMaterial = createDynamicNetTexture({
                canvasSize: 128,
                lineWidth: 20,
                lineColor: '#dddddd',
                materialColor: 0xffffff
            });

            // Tile the canvas texture across the net plane
            const desiredNetSquareSize = 0.1; // Each net square is 10cm wide/high
            dynamicNetTexture.repeat.set(NET_LENGTH / desiredNetSquareSize, NET_VISUAL_HEIGHT / desiredNetSquareSize);
            dynamicNetTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            dynamicNetTexture.needsUpdate = true;

            net = new THREE.Mesh(netGeometry, netMaterial);
            net.rotation.y = Math.PI / 2; // Rotate to span Z axis
            scene.add(net);

            // Net Bands (Top and Bottom)
            const bandGeometry = new THREE.PlaneGeometry(NET_LENGTH, NET_BAND_HEIGHT);
            const bandMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0xAAAAAA,
                side: THREE.DoubleSide,
                roughness: 0.8,
                metalness: 0.0,
                polygonOffset: true,
                polygonOffsetFactor: -1.0,
                polygonOffsetUnits: -1.0
            });
            netTopBand = new THREE.Mesh(bandGeometry, bandMaterial);
            netTopBand.rotation.y = Math.PI / 2;
            netTopBand.castShadow = true;
            netTopBand.receiveShadow = true;
            scene.add(netTopBand);
            netBottomBand = new THREE.Mesh(bandGeometry, bandMaterial);
            netBottomBand.rotation.y = Math.PI / 2;
            netBottomBand.castShadow = true;
            netBottomBand.receiveShadow = true;
            scene.add(netBottomBand);

            // Cables connecting the net bands to the poles (positions set in updateNetHeight)
            netCables = new THREE.LineSegments(
                new THREE.BufferGeometry(),
                new THREE.LineBasicMaterial({ color: 0xdddddd })
            );
            scene.add(netCables);

            // Antennas and their holders (geometry set in updateNetHeight)
            for (let i = 0; i < 2; i++) {
                antennas[i] = new THREE.Mesh(undefined, dynamicAntennaMaterial);
                antennas[i].castShadow = true;
                scene.add(antennas[i]);
                antennaHolders[i] = new THREE.Mesh(undefined, holderMaterial);
                antennaHolders[i].castShadow = true;
                scene.add(antennaHolders[i]);
            }
        }

        function updateNetHeight() {
            currentNetHeight = genderMaleRadio.checked ? NET_HEIGHT_MEN : NET_HEIGHT_WOMEN;

            if (net && netTopBand && netBottomBand && antennas.length === 2) {
                net.position.y = currentNetHeight - (NET_VISUAL_HEIGHT / 2);
                netTopBand.position.y = currentNetHeight - (NET_BAND_HEIGHT / 2);
                const bottomEdgeY = currentNetHeight - NET_VISUAL_HEIGHT;
                netBottomBand.position.y = bottomEdgeY + (NET_BAND_HEIGHT / 2);

                // Cables from the band ends to the poles
                const topCableY = netTopBand.position.y;
                const bottomCableY = netBottomBand.position.y;
                const netEndZ = NET_LENGTH / 2;
                const poleZ = POLE_DISTANCE / 2 - POLE_RADIUS;
                netCables.geometry.dispose();
                netCables.geometry = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, topCableY, netEndZ), new THREE.Vector3(0, topCableY, poleZ),
                    new THREE.Vector3(0, topCableY, -netEndZ), new THREE.Vector3(0, topCableY, -poleZ),
                    new THREE.Vector3(0, bottomCableY, netEndZ), new THREE.Vector3(0, bottomCableY, poleZ),
                    new THREE.Vector3(0, bottomCableY, -netEndZ), new THREE.Vector3(0, bottomCableY, -poleZ),
                ]);

                // Antennas run from the bottom edge of the net to ANTENNA_HEIGHT above the net
                const antennaTopY = currentNetHeight + ANTENNA_HEIGHT;
                const totalAntennaLength = antennaTopY - bottomEdgeY;
                const antennaCenterY = bottomEdgeY + (totalAntennaLength / 2);
                const patternHeightMeters = 0.20; // One red + one white 10 cm stripe
                dynamicAntennaTexture.repeat.set(1, totalAntennaLength / patternHeightMeters); // 1.8 m => 9 repeats
                dynamicAntennaTexture.needsUpdate = true;

                antennas.forEach((antenna, index) => {
                    const antennaZ = (index === 0 ? COURT_WIDTH / 2 : -COURT_WIDTH / 2);

                    if (antenna.geometry) antenna.geometry.dispose();
                    antenna.geometry = new THREE.CylinderGeometry(ANTENNA_RADIUS, ANTENNA_RADIUS, totalAntennaLength, 16);
                    antenna.position.set(0, antennaCenterY, antennaZ);

                    // Holder covers the antenna along the net mesh height
                    const holder = antennaHolders[index];
                    if (holder.geometry) holder.geometry.dispose();
                    holder.geometry = new THREE.CylinderGeometry(ANTENNA_RADIUS + 0.002, ANTENNA_RADIUS + 0.002, NET_VISUAL_HEIGHT, 16);
                    holder.position.set(0, currentNetHeight - (NET_VISUAL_HEIGHT / 2), antennaZ);
                });
            }
        }

        function createBall() {
            const ballGeometry = new THREE.SphereGeometry(BALL_RADIUS, 32, 32);
            const ballMaterial = new THREE.MeshStandardMaterial({
                map: ballTexture,
                roughness: 0.7,
                metalness: 0.1
            });
            ball = new THREE.Mesh(ballGeometry, ballMaterial);
            ball.castShadow = true;
            ball.receiveShadow = false;
            scene.add(ball);
            resetBallPosition();
        }

        function createHelpers() {
            serveArrow = createCustomArrow(0xff8888, 0.01, 0.2, 3);
            scene.add(serveArrow);

            // Wind Arrows
            const windArrowY = POLE_HEIGHT + 0.4;
            windArrow1 = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, windArrowY, POLE_DISTANCE / 2 + 0.5), 1, 0x4169E1, 0.5, 0.3);
            windArrow2 = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, windArrowY, -POLE_DISTANCE / 2 - 0.5), 1, 0x4169E1, 0.5, 0.3);
            scene.add(windArrow1);
            scene.add(windArrow2);
        }

        // --- Custom arrow (shaft and head are built along Y and scaled along Y for length) ---
        function createCustomArrow(color, shaftRadius, headLengthRatio, headWidthRatio) {
            const headLength = headLengthRatio;
            const shaftLength = 1.0 - headLengthRatio;

            const material = new THREE.MeshStandardMaterial({
                color: color,
                metalness: 0.4,
                roughness: 0.6,
            });

            // Shaft: origin at its base
            const shaftGeo = new THREE.CylinderGeometry(shaftRadius, shaftRadius, shaftLength, 16);
            shaftGeo.translate(0, shaftLength / 2, 0);
            const shaftMesh = new THREE.Mesh(shaftGeo, material);

            // Head: origin at its base, placed at the end of the shaft
            const headGeo = new THREE.ConeGeometry(shaftRadius * headWidthRatio, headLength, 16);
            headGeo.translate(0, headLength / 2, 0);
            const headMesh = new THREE.Mesh(headGeo, material);
            headMesh.position.y = shaftLength;

            // The group's origin is the base of the shaft
            const arrowGroup = new THREE.Group();
            arrowGroup.add(shaftMesh);
            arrowGroup.add(headMesh);

            arrowGroup.updateArrow = function (origin, direction, length) {
                if (!direction || direction.lengthSq() === 0 || length <= 0) {
                    this.visible = false;
                    return;
                }
                // Scale only local Y to control the length while keeping the radius
                this.scale.set(1, length, 1);
                this.position.copy(origin);
                // setFromUnitVectors handles opposite vectors as well
                this.quaternion.setFromUnitVectors(UP, direction.clone().normalize());
                this.visible = true;
            };

            arrowGroup.visible = false;
            return arrowGroup;
        }

        function updateServePosition() {
            const position = launchPositionSelect.value;
            const serveX = -COURT_LENGTH / 2 - 0.8; // Slightly behind the baseline
            const serveY = parseFloat(contactHeightSlider.value); // Ball center at contact

            // Coordinate system (looking from the server towards the net):
            // +X: forward (towards net), +Y: up, +Z: server's right, -Z: server's left
            switch (position) {
                case 'leftCorner':
                    currentServePosition.set(serveX, serveY, -COURT_WIDTH / 2 + 0.5);
                    break;
                case 'rightCorner':
                    currentServePosition.set(serveX, serveY, COURT_WIDTH / 2 - 0.5);
                    break;
                case 'center':
                default:
                    currentServePosition.set(serveX, serveY, 0);
                    break;
            }

            if (!isBusy()) {
                resetBallPosition();
                updateArrow();
            }
        }

        // Unit direction of the serve from the angle sliders
        function getLaunchDirection() {
            const vAngle = parseFloat(verticalAngleSlider.value) * Math.PI / 180;
            const hAngle = -parseFloat(horizontalAngleSlider.value) * Math.PI / 180; // Negative so that + = right (+Z)

            const dir = new THREE.Vector3(1, 0, 0);
            dir.applyAxisAngle(new THREE.Vector3(0, 0, 1), vAngle); // Pitch
            dir.applyAxisAngle(UP, hAngle);                         // Yaw
            return dir.normalize();
        }

        function calculateInitialVelocity() {
            return getLaunchDirection().multiplyScalar(parseFloat(launchSpeedSlider.value));
        }

        function updateArrow() {
            if (!serveArrow) return;
            if (isBusy()) {
                serveArrow.visible = false;
                return;
            }
            const speed = parseFloat(launchSpeedSlider.value);
            const arrowLength = THREE.MathUtils.clamp(speed / 16, 0.6, 3);
            serveArrow.updateArrow(currentServePosition, getLaunchDirection(), arrowLength);
        }

        function updateWindVisualization() {
            const enabled = enableWindCheckbox.checked;
            windControlsDiv.classList.toggle('hidden', !enabled);
            windArrow1.visible = enabled;
            windArrow2.visible = enabled;

            if (!enabled) {
                windVelocity.set(0, 0, 0);
                return;
            }

            const speed = parseFloat(windStrengthSlider.value);
            const directionRadians = parseFloat(windDirectionSlider.value) * Math.PI / 180;
            // Direction the wind blows towards (0° = +X towards net, 90° = +Z right)
            const windDir = new THREE.Vector3(Math.cos(directionRadians), 0, Math.sin(directionRadians));

            const arrowLength = THREE.MathUtils.clamp(speed * 0.25, 0.5, 2.5);
            const arrowHeadLength = Math.min(0.5, arrowLength * 0.4);
            const arrowHeadWidth = Math.min(0.3, arrowLength * 0.3);
            windArrow1.setDirection(windDir);
            windArrow1.setLength(arrowLength, arrowHeadLength, arrowHeadWidth);
            windArrow2.setDirection(windDir);
            windArrow2.setLength(arrowLength, arrowHeadLength, arrowHeadWidth);

            // The air moves with this velocity; drag and Magnus act on the velocity relative to the air
            windVelocity.copy(windDir).multiplyScalar(speed);
        }

        function resetBallPosition() {
            ballPosition.copy(currentServePosition);
            ballVelocity.set(0, 0, 0);
            if (ball) ball.position.copy(ballPosition);
        }

        // --- UI State ---
        function isBallCamPhase() {
            return ballCamInUse || isTransitioningToBallCam || isWaitingAfterBallCam || isTransitioningFromBallCam;
        }

        function isBusy() {
            return isSimulating || isBallCamPhase();
        }

        // Single place that enables/disables controls depending on the simulation state
        function updateUIState() {
            const busy = isBusy();
            serveButton.disabled = busy;
            quickServeButton.disabled = busy;
            if (!busy) serveButton.textContent = 'Serve!';
            else if (isTransitioningToBallCam) serveButton.textContent = 'Positioning Cam...';
            else if (isSimulating) serveButton.textContent = 'Simulating...';
            else serveButton.textContent = 'Returning Camera...';

            // Settings are locked for the whole serve so they can't change mid-flight
            settingsFieldsets.forEach(fs => { fs.disabled = busy; });
            // Camera presets stay usable during a normal flight, but not while the ball cam owns the camera
            cameraFieldset.disabled = isBallCamPhase();
            enableBallCamCheckbox.disabled = busy;
        }

        function resetSimulation() {
            isSimulating = false;
            isTransitioningToBallCam = false;
            isWaitingAfterBallCam = false;
            isTransitioningFromBallCam = false;

            if (ballCamInUse) restoreCamera();

            trajectoryPoints = [];
            if (trajectoryLine) {
                scene.remove(trajectoryLine);
                trajectoryLine.geometry.dispose();
                trajectoryLine.material.dispose();
                trajectoryLine = null;
            }

            if (ball) ball.rotation.set(0, 0, 0);
            updateServePosition(); // Resets ball and arrow
            resetResults();

            if (controls && !controls.enabled) controls.enabled = true;
            updateUIState();
        }

        function resetResults() {
            resultClassification.textContent = '-';
            resultClassification.className = 'val';
            resultSpeedLabel.textContent = 'Landing Speed:';
            resultFinalSpeed.textContent = '- m/s';
            resultFlightTime.textContent = '- s';
            resultDifficulty.textContent = '- / 100';
        }

        // --- Physics Simulation ---
        const _relVel = new THREE.Vector3();
        const _force = new THREE.Vector3();
        const _magnus = new THREE.Vector3();

        // Acceleration of the ball for a given velocity (gravity + drag + Magnus, wind via relative air velocity)
        function calculateAcceleration(velocity, out) {
            out.set(0, -GRAVITY * BALL_MASS, 0);

            _relVel.copy(velocity).sub(windVelocity);
            const relSpeedSq = _relVel.lengthSq();
            if (relSpeedSq > 1e-8) {
                const relSpeed = Math.sqrt(relSpeedSq);
                const dynamicPressureArea = 0.5 * AIR_DENSITY * BALL_AREA * relSpeedSq;

                // Drag: opposite to the velocity relative to the air
                _force.copy(_relVel).multiplyScalar(-DRAG_COEFFICIENT * dynamicPressureArea / relSpeed);
                out.add(_force);

                // Magnus: perpendicular to spin axis and relative velocity
                if (spinRate !== 0) {
                    const spinParameter = Math.abs(spinRate) * BALL_RADIUS / relSpeed;
                    const liftCoefficient = 1 / (2 + 1 / spinParameter); // Empirical sphere fit
                    _magnus.crossVectors(spinAxis, _relVel).normalize()
                        .multiplyScalar(Math.sign(spinRate) * liftCoefficient * dynamicPressureArea);
                    out.add(_magnus);
                }
            }
            return out.divideScalar(BALL_MASS);
        }

        const _accel = new THREE.Vector3();

        // Advances the simulation by one fixed step (semi-implicit Euler)
        function physicsStep() {
            prevBallPosition.copy(ballPosition);
            calculateAcceleration(ballVelocity, _accel);
            ballVelocity.addScaledVector(_accel, PHYSICS_DT);
            ballPosition.addScaledVector(ballVelocity, PHYSICS_DT);
            simTime += PHYSICS_DT;

            checkCollisions();

            if (isSimulating && simTime >= MAX_FLIGHT_TIME) {
                stopSimulation('Timeout', 'Speed');
            }
        }

        function updatePhysics(deltaTime) {
            physicsAccumulator += Math.min(deltaTime, MAX_FRAME_DELTA);
            let steps = 0;
            while (isSimulating && physicsAccumulator >= PHYSICS_DT) {
                physicsStep();
                physicsAccumulator -= PHYSICS_DT;
                steps++;
            }

            if (ball) {
                ball.position.copy(ballPosition);
                if (spinRate !== 0) ball.rotateOnWorldAxis(spinAxis, spinRate * steps * PHYSICS_DT);
            }
            if (isSimulating) trajectoryPoints.push(ballPosition.clone());
        }

        // --- Collision Detection ---
        const _closest = new THREE.Vector3();
        const _normal = new THREE.Vector3();

        function checkCollisions() {
            const pos = ballPosition;

            // 1. Ground: interpolate back to the exact moment the ball touches the sand
            if (pos.y <= BALL_RADIUS) {
                const t = (prevBallPosition.y - BALL_RADIUS) / (prevBallPosition.y - pos.y);
                pos.lerpVectors(prevBallPosition, pos, THREE.MathUtils.clamp(t, 0, 1));
                pos.y = BALL_RADIUS;
                stopSimulation(classifyGroundHit(), 'Landing Speed');
                return;
            }

            // 2. Antennas: vertical cylinders from the net bottom to ANTENNA_HEIGHT above the net
            const antennaBottomY = currentNetHeight - NET_VISUAL_HEIGHT;
            const antennaTopY = currentNetHeight + ANTENNA_HEIGHT;
            for (const antennaZ of [COURT_WIDTH / 2, -COURT_WIDTH / 2]) {
                _closest.set(0, THREE.MathUtils.clamp(pos.y, antennaBottomY, antennaTopY), antennaZ);
                if (pos.distanceTo(_closest) < BALL_RADIUS + ANTENNA_RADIUS) {
                    stopSimulation('Antenna Hit', 'Impact Speed');
                    return;
                }
            }

            // 3. Net: a vertical rectangle in the plane x = 0; the top NET_BAND_HEIGHT is the tape
            _closest.set(
                0,
                THREE.MathUtils.clamp(pos.y, currentNetHeight - NET_VISUAL_HEIGHT, currentNetHeight),
                THREE.MathUtils.clamp(pos.z, -NET_LENGTH / 2, NET_LENGTH / 2)
            );
            if (pos.distanceTo(_closest) < BALL_RADIUS) {
                if (Math.abs(pos.z) > COURT_WIDTH / 2) {
                    // Touching the net outside the antennas is a fault
                    stopSimulation('Out (Net Outside Antennas)', 'Impact Speed');
                    return;
                }
                if (_closest.y < currentNetHeight - NET_BAND_HEIGHT) {
                    stopSimulation('Net Hit', 'Impact Speed');
                    return;
                }
                handleTapeContact(_closest);
            }

            // 4. Crossing the vertical plane of the net
            if (!crossedNet && prevBallPosition.x < 0 && pos.x >= 0) {
                crossedNet = true;
                const t = -prevBallPosition.x / (pos.x - prevBallPosition.x);
                const crossY = THREE.MathUtils.lerp(prevBallPosition.y, pos.y, t);
                const crossZ = Math.abs(THREE.MathUtils.lerp(prevBallPosition.z, pos.z, t));
                const antennaClearance = BALL_RADIUS + ANTENNA_RADIUS;

                // The crossing space is bounded by the antennas and their imaginary extension upwards
                if (crossZ >= COURT_WIDTH / 2 + antennaClearance) {
                    pendingFault = 'Out (Outside Antennas)';
                } else if (crossZ > COURT_WIDTH / 2 - antennaClearance) {
                    pendingFault = 'Out (Over Antenna)';
                } else if (crossY < currentNetHeight) {
                    pendingFault = 'Out (Under Net)';
                }
            }
        }

        // Ball touches the net tape: impulse-based contact with restitution and Coulomb friction.
        // Depending on where the tape is hit, the ball bounces back or rolls over.
        function handleTapeContact(contactPoint) {
            touchedTape = true;
            _normal.copy(ballPosition).sub(contactPoint);
            const dist = _normal.length();
            if (dist < 1e-6) {
                _normal.set(-Math.sign(ballVelocity.x) || -1, 0, 0);
            } else {
                _normal.divideScalar(dist);
            }

            // Push the ball out of the tape
            ballPosition.copy(contactPoint).addScaledVector(_normal, BALL_RADIUS);

            const vn = ballVelocity.dot(_normal);
            if (vn >= 0) return; // Already separating

            const restitution = -vn > MIN_BOUNCE_SPEED ? COR_NET_TAPE : 0;
            const normalImpulse = -(1 + restitution) * vn; // Velocity change along the normal

            const tangential = ballVelocity.clone().addScaledVector(_normal, -vn);
            const tangentialSpeed = tangential.length();

            ballVelocity.addScaledVector(_normal, normalImpulse);
            if (tangentialSpeed > 1e-6) {
                const frictionDelta = Math.min(TAPE_FRICTION * normalImpulse, tangentialSpeed);
                ballVelocity.addScaledVector(tangential, -frictionDelta / tangentialSpeed);
            }
        }

        function classifyGroundHit() {
            if (pendingFault) return pendingFault;

            const ballX = ballPosition.x;
            const ballZ = ballPosition.z;

            if (!crossedNet || ballX <= 0) {
                return touchedTape ? 'Net Hit (Fell Back)' : "Didn't Cross Net";
            }

            // The ball is in when its contact point touches the court, lines included
            const isLong = ballX > COURT_LENGTH / 2;
            const isWide = Math.abs(ballZ) > COURT_WIDTH / 2;

            if (isLong && isWide) return 'Out (Long & Wide)';
            if (isLong) return 'Out (Long)';
            if (isWide) return 'Out (Wide)';
            return 'In';
        }

        function stopSimulation(reason, speedLabel) {
            if (!isSimulating) return; // Prevent double stop
            isSimulating = false;
            if (ball) ball.position.copy(ballPosition);
            trajectoryPoints.push(ballPosition.clone());

            const finalSpeed = ballVelocity.length();
            resultClassification.textContent = reason;
            resultClassification.className = 'val ' + (reason === 'In' ? 'in' : 'fault');
            resultSpeedLabel.textContent = `${speedLabel}:`;
            resultFinalSpeed.textContent = `${finalSpeed.toFixed(1)} m/s`;
            resultFlightTime.textContent = `${simTime.toFixed(2)} s`;
            resultDifficulty.textContent = `${calculateDifficultyScore(finalSpeed, simTime, ballPosition, reason)} / 100`;
            drawTrajectory();

            if (ballCamInUse) {
                // Stay in ball cam view for a moment, then fly the camera back (see animate)
                isWaitingAfterBallCam = true;
                ballCamEndTime = performance.now();
            } else {
                if (controls) controls.enabled = true;
                updateArrow();
            }
            updateUIState();
        }

        // --- Difficulty Score ---
        function calculateDifficultyScore(speed, time, landingPos, reason) {
            if (reason !== 'In') return 0; // No score if out or net hit

            // Distance from the nearest typical receiver position
            const landingXZ = new THREE.Vector3(landingPos.x, 0, landingPos.z);
            const distanceToReceiver = Math.min(...RECEIVER_POSITIONS.map(p => landingXZ.distanceTo(p)));

            // Score components (0 to 1)
            const speedScore = THREE.MathUtils.clamp((speed - 10) / (28 - 10), 0, 1);   // Higher landing speed is harder
            const timeScore = THREE.MathUtils.clamp((1.8 - time) / (1.8 - 0.6), 0, 1);  // Less reaction time is harder
            const positionScore = THREE.MathUtils.clamp(distanceToReceiver / 3.5, 0, 1); // Farther from receivers is harder

            const rawScore = speedScore * 0.45 + timeScore * 0.25 + positionScore * 0.30;
            return Math.round(rawScore * 100);
        }

        // --- Trajectory Visualization ---
        function drawTrajectory() {
            if (trajectoryLine) {
                scene.remove(trajectoryLine);
                trajectoryLine.geometry.dispose();
                trajectoryLine.material.dispose();
                trajectoryLine = null;
            }
            if (trajectoryPoints.length < 2) return;

            const material = new THREE.LineBasicMaterial({ color: 0xe60000 });
            const geometry = new THREE.BufferGeometry().setFromPoints(trajectoryPoints);
            trajectoryLine = new THREE.Line(geometry, material);
            scene.add(trajectoryLine);
        }

        // --- Event Handlers ---
        function updateValueDisplays() {
            contactHeightValue.textContent = `${parseFloat(contactHeightSlider.value).toFixed(2)} m`;
            launchSpeedValue.textContent = `${parseFloat(launchSpeedSlider.value).toFixed(1)} m/s`;
            verticalAngleValue.textContent = `${verticalAngleSlider.value} °`;
            horizontalAngleValue.textContent = `${horizontalAngleSlider.value} °`;
            const spin = parseFloat(spinSlider.value);
            const spinType = spin > 0 ? 'topspin' : spin < 0 ? 'backspin' : 'float';
            spinValue.textContent = `${Math.abs(spin).toFixed(1)} rev/s (${spinType})`;
            windStrengthValue.textContent = `${parseFloat(windStrengthSlider.value).toFixed(1)} m/s`;
            windDirectionValue.textContent = `${windDirectionSlider.value} °`;
        }

        function setupUIListeners() {
            genderMaleRadio.addEventListener('change', handleGenderChange);
            genderFemaleRadio.addEventListener('change', handleGenderChange);
            launchPositionSelect.addEventListener('change', handleSettingsChange);
            enableWindCheckbox.addEventListener('change', handleSettingsChange);

            // Sliders: update the display and reset the ball/trajectory to reflect the new setting
            [contactHeightSlider, launchSpeedSlider, verticalAngleSlider, horizontalAngleSlider,
             spinSlider, windStrengthSlider, windDirectionSlider].forEach(slider => {
                slider.addEventListener('input', () => {
                    updateValueDisplays();
                    handleSettingsChange();
                });
            });

            serveButton.addEventListener('click', startServe);
            quickServeButton.addEventListener('click', startServe);

            camBehindButton.addEventListener('click', () => setCameraPosition('behind'));
            camBaselineSideButton.addEventListener('click', () => setCameraPosition('baselineSide'));
            camCourtSideButton.addEventListener('click', () => setCameraPosition('courtSide'));
            camTopButton.addEventListener('click', () => setCameraPosition('top'));

            toggleControlsButton.addEventListener('click', () => {
                controlsDiv.classList.toggle('collapsed');
                const isCollapsed = controlsDiv.classList.contains('collapsed');
                toggleControlsButton.setAttribute('aria-expanded', String(!isCollapsed));
            });
        }

        // Collapse the controls panel on small screens
        function checkScreenSizeAndCollapse() {
            const mobileBreakpoint = 768;
            if (window.innerWidth < mobileBreakpoint && !controlsDiv.classList.contains('collapsed')) {
                controlsDiv.classList.add('collapsed');
                toggleControlsButton.setAttribute('aria-expanded', 'false');
            }
        }

        // Gender sets the net height and the default contact height
        function handleGenderChange() {
            contactHeightSlider.value = genderMaleRadio.checked ? CONTACT_HEIGHT_MEN : CONTACT_HEIGHT_WOMEN;
            updateValueDisplays();
            handleSettingsChange();
        }

        function handleSettingsChange() {
            if (isBusy()) return; // Inputs are locked during a serve
            updateNetHeight();
            updateWindVisualization();
            resetSimulation(); // Resets ball, trajectory, arrow and results
        }

        function startServe() {
            if (isBusy()) return;

            resetSimulation();

            if (enableBallCamCheckbox.checked) {
                ballCamInUse = true;
                storeCamera();
                if (controls) controls.enabled = false;
                isTransitioningToBallCam = true;

                // Camera starts slightly behind and above the ball, looking along the initial path
                const velocityDirection = getLaunchDirection();
                targetBallCamPos.copy(currentServePosition)
                    .addScaledVector(velocityDirection, -0.6)
                    .add(new THREE.Vector3(0, 0.2, 0));
                targetBallCamLookAt.copy(currentServePosition).addScaledVector(velocityDirection, 5.0);
                // Physics starts after the transition completes (see animate)
            } else {
                ballCamInUse = false;
                startPhysicsSimulation();
            }
            updateArrow();
            updateUIState();
        }

        function startPhysicsSimulation() {
            ballPosition.copy(currentServePosition);
            ballVelocity.copy(calculateInitialVelocity());
            if (ball) ball.position.copy(ballPosition);

            // Spin axis is horizontal and perpendicular to the serve direction:
            // positive spinRate = topspin (ball dips), negative = backspin (ball floats)
            const horizontalDir = new THREE.Vector3(ballVelocity.x, 0, ballVelocity.z).normalize();
            spinAxis.crossVectors(UP, horizontalDir).normalize();
            spinRate = parseFloat(spinSlider.value) * 2 * Math.PI;

            trajectoryPoints = [ballPosition.clone()];
            simTime = 0;
            physicsAccumulator = 0;
            crossedNet = false;
            touchedTape = false;
            pendingFault = null;

            isSimulating = true;
            updateUIState();
        }

        function onWindowResize() {
            if (!camera || !renderer || !container) return;
            const width = container.clientWidth;
            const height = container.clientHeight;
            if (width === 0 || height === 0) return;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        // --- Camera Control ---
        function setCameraPosition(preset) {
            if (isBallCamPhase() || !camera || !controls) return;

            controls.enabled = true;
            switch (preset) {
                case 'baselineSide':
                    camera.position.set(COURT_LENGTH * 0.55, 5, POLE_DISTANCE * 0.8);
                    controls.target.set(0, currentNetHeight * 0.5, 0);
                    break;
                case 'courtSide':
                    camera.position.set(0, currentNetHeight * 1.5, COURT_WIDTH * 1.8);
                    controls.target.set(0, currentNetHeight * 0.6, 0);
                    break;
                case 'top':
                    camera.position.set(0, COURT_LENGTH * 1.1, 0.1);
                    controls.target.set(0, 0, 0);
                    break;
                case 'behind':
                default: {
                    // Behind the server, panned slightly with the server's Z position
                    const offset = new THREE.Vector3(-4.5, 2.8, currentServePosition.z * 0.6);
                    camera.position.copy(currentServePosition).add(offset);
                    controls.target.set(COURT_LENGTH * 0.1, currentNetHeight * 0.5, currentServePosition.z * 0.4);
                    break;
                }
            }
            controls.update();
        }

        function updateBallCamera(deltaTime) {
            if (!ballCamInUse || !isSimulating || !ball || ballVelocity.lengthSq() < 0.01) return;

            const velocityDirection = ballVelocity.clone().normalize();
            // Behind and slightly above the ball, looking ahead along the trajectory
            const desiredPosition = ballPosition.clone()
                .addScaledVector(velocityDirection, -0.6)
                .add(new THREE.Vector3(0, 0.2, 0));
            const lookAtTarget = ballPosition.clone().addScaledVector(velocityDirection, 5.0);

            camera.position.lerp(desiredPosition, frameLerp(BALL_CAM_FOLLOW_SPEED, deltaTime));
            camera.lookAt(lookAtTarget);
        }

        function storeCamera() {
            preBallCamPosition.copy(camera.position);
            preBallCamTarget.copy(controls.target);
        }

        function restoreCamera() {
            camera.position.copy(preBallCamPosition);
            controls.target.copy(preBallCamTarget);
            controls.enabled = true;
            controls.update();
            ballCamInUse = false;
        }

        // --- Save/Load Functionality ---
        const slotKey = slot => `vbServeSim_slot_${slot}`;

        function readSlot(slot) {
            try {
                const raw = localStorage.getItem(slotKey(slot));
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        function showSaveStatus(message, isError = false) {
            saveStatus.textContent = message;
            saveStatus.classList.toggle('error', isError);
            clearTimeout(showSaveStatus.timer);
            showSaveStatus.timer = setTimeout(() => { saveStatus.textContent = ''; }, 2500);
        }

        function generateSaveLoadButtons() {
            saveLoadDiv.innerHTML = '';
            for (let i = 1; i <= NUM_SAVE_SLOTS; i++) {
                const settings = readSlot(i);

                const label = document.createElement('span');
                label.className = 'slot-label';
                label.textContent = `${i}`;

                const summary = document.createElement('span');
                summary.className = 'slot-summary' + (settings ? '' : ' empty');
                summary.textContent = settings
                    ? `${parseFloat(settings.launchSpeed).toFixed(1)} m/s · ${settings.verticalAngle}° · ${settings.gender === 'female' ? 'W' : 'M'}`
                    : 'empty';

                const saveButton = document.createElement('button');
                saveButton.textContent = 'Save';
                saveButton.title = `Save settings to slot ${i}`;
                saveButton.addEventListener('click', () => saveSettings(i));

                const loadButton = document.createElement('button');
                loadButton.textContent = 'Load';
                loadButton.title = `Load settings from slot ${i}`;
                loadButton.disabled = !settings;
                loadButton.addEventListener('click', () => loadSettings(i));

                saveLoadDiv.append(label, summary, saveButton, loadButton);
            }
        }

        function saveSettings(slot) {
            if (isBusy()) return;
            const settings = {
                version: 2,
                gender: genderMaleRadio.checked ? 'male' : 'female',
                launchPosition: launchPositionSelect.value,
                contactHeight: contactHeightSlider.value,
                launchSpeed: launchSpeedSlider.value,
                verticalAngle: verticalAngleSlider.value,
                horizontalAngle: horizontalAngleSlider.value,
                spin: spinSlider.value,
                windEnabled: enableWindCheckbox.checked,
                windStrength: windStrengthSlider.value, // m/s since version 2
                windDirection: windDirectionSlider.value,
                ballCamEnabledPref: enableBallCamCheckbox.checked,
                camera: {
                    position: camera.position.toArray(),
                    target: controls.target.toArray()
                }
            };
            try {
                localStorage.setItem(slotKey(slot), JSON.stringify(settings));
                showSaveStatus(`Saved to slot ${slot}.`);
            } catch (e) {
                console.error(`Could not save settings to slot ${slot}:`, e);
                showSaveStatus('Could not save: browser storage is full or disabled.', true);
            }
            generateSaveLoadButtons();
        }

        function loadSettings(slot) {
            if (isBusy()) return;
            const settings = readSlot(slot);
            if (!settings) {
                showSaveStatus(`Slot ${slot} is empty or unreadable.`, true);
                return;
            }

            if (settings.gender === 'female') genderFemaleRadio.checked = true;
            else genderMaleRadio.checked = true;
            launchPositionSelect.value = settings.launchPosition ?? 'center';
            contactHeightSlider.value = settings.contactHeight
                ?? (settings.gender === 'female' ? CONTACT_HEIGHT_WOMEN : CONTACT_HEIGHT_MEN);
            launchSpeedSlider.value = settings.launchSpeed ?? 15;
            verticalAngleSlider.value = settings.verticalAngle ?? 20;
            horizontalAngleSlider.value = settings.horizontalAngle ?? 0;
            spinSlider.value = settings.spin ?? 0;
            enableWindCheckbox.checked = settings.windEnabled ?? false;
            windStrengthSlider.value = settings.windStrength ?? 3;
            windDirectionSlider.value = settings.windDirection ?? 0;
            enableBallCamCheckbox.checked = settings.ballCamEnabledPref ?? false;
            updateValueDisplays();

            handleSettingsChange(); // Net height, wind, serve position, reset

            if (settings.camera?.position && settings.camera?.target) {
                camera.position.fromArray(settings.camera.position);
                controls.target.fromArray(settings.camera.target);
                controls.update();
            } else {
                setCameraPosition('behind');
            }
            showSaveStatus(`Loaded slot ${slot}.`);
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta();

            // 1. Pre-serve ball cam transition (moving camera into position)
            if (isTransitioningToBallCam) {
                camera.position.lerp(targetBallCamPos, frameLerp(BALL_CAM_TRANSITION_SPEED, deltaTime));
                camera.lookAt(targetBallCamLookAt);

                if (camera.position.distanceTo(targetBallCamPos) < 0.1) {
                    camera.position.copy(targetBallCamPos);
                    isTransitioningToBallCam = false;
                    startPhysicsSimulation();
                }
            }

            // 2. Physics
            if (isSimulating) updatePhysics(deltaTime);

            // 3. Ball camera follows the ball
            if (ballCamInUse && isSimulating) updateBallCamera(deltaTime);

            // 4. Post-serve ball cam delay
            if (isWaitingAfterBallCam && performance.now() - ballCamEndTime > BALL_CAM_END_DELAY) {
                isWaitingAfterBallCam = false;
                isTransitioningFromBallCam = true;
                updateUIState();
            }

            // 5. Return transition (moving camera back)
            if (isTransitioningFromBallCam) {
                const alpha = frameLerp(BALL_CAM_TRANSITION_SPEED, deltaTime);
                camera.position.lerp(preBallCamPosition, alpha);
                controls.target.lerp(preBallCamTarget, alpha);

                const posClose = camera.position.distanceTo(preBallCamPosition) < 0.1;
                const targetClose = controls.target.distanceTo(preBallCamTarget) < 0.1;

                if (posClose && targetClose) {
                    isTransitioningFromBallCam = false;
                    restoreCamera(); // Snap to final state, re-enable controls
                    updateUIState();
                    updateArrow();
                } else {
                    // Controls are disabled here, so update them manually to keep the camera aimed at the target
                    controls.update();
                }
            }

            // 6. OrbitControls (damping etc.)
            if (controls.enabled) controls.update();

            renderer.render(scene, camera);
        }

        // --- Start ---
        init();
    </script>
</body>
</html>
