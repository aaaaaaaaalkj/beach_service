<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Beach Volleyball Serve Simulation</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="container"></div>
    <div id="controls">
        <fieldset id="basicsFieldset">
            <legend>Serve Basics</legend>
            <div class="inline-row">
                <input type="radio" id="genderMale" name="gender" value="male" checked> <label for="genderMale">Men</label>
                <input type="radio" id="genderFemale" name="gender" value="female"> <label for="genderFemale">Women</label>
                <select id="launchPosition" aria-label="Launch Position">
                    <option value="center">Center Baseline</option>
                    <option value="leftCorner">Left Corner</option>
                    <option value="rightCorner">Right Corner</option>
                </select>
            </div>
            <div>
                <label for="contactHeight">Contact Height: <span id="contactHeightValue" class="value-display">2.20 m</span></label>
                <input type="range" id="contactHeight" min="1.8" max="3.6" value="2.2" step="0.05">
            </div>
        </fieldset>

        <fieldset id="launchFieldset">
            <legend>Launch Parameters</legend>
            <div>
                <label for="launchSpeed">Speed: <span id="launchSpeedValue" class="value-display">15.0 m/s</span></label>
                <input type="range" id="launchSpeed" min="5" max="30" value="15" step="0.5">
            </div>
            <div>
                <label for="verticalAngle">Vertical Angle: <span id="verticalAngleValue" class="value-display">20 °</span></label>
                <input type="range" id="verticalAngle" min="1" max="89" value="20" step="1">
            </div>
            <div>
                <label for="horizontalAngle">Horizontal Angle: <span id="horizontalAngleValue" class="value-display">0 °</span> <span class="hint">(- Left / + Right)</span></label>
                <input type="range" id="horizontalAngle" min="-45" max="45" value="0" step="1">
            </div>
            <div>
                <label for="spin">Spin: <span id="spinValue" class="value-display">0.0 rev/s (float)</span> <span class="hint">(- Back / + Top)</span></label>
                <input type="range" id="spin" min="-5" max="15" value="0" step="0.5">
            </div>
            <div class="inline-row seed-row" title="How the panels face the hitter and the small leftover spin. This decides how a float serve knuckles.">
                <span>Ball contact:</span>
                <span id="floatSeedValue" class="value-display">#1</span>
                <input type="hidden" id="floatSeed" value="1">
                <button id="rerollSeed" type="button">🎲 New</button>
                <label for="autoReroll"><input type="checkbox" id="autoReroll"> every serve</label>
            </div>
        </fieldset>

        <fieldset id="environmentFieldset">
            <legend>Environment</legend>
            <label for="enableWind">
                <input type="checkbox" id="enableWind"> Enable Wind
            </label>
            <div id="windControls" class="hidden">
                <label for="windStrength">Speed: <span id="windStrengthValue" class="value-display">3.0 m/s</span></label>
                <input type="range" id="windStrength" min="0" max="10" value="3" step="0.5">
                <label for="windDirection">Blowing Towards: <span id="windDirectionValue" class="value-display">0 °</span> <span class="hint">(0° = Net, 90° = Right)</span></label>
                <input type="range" id="windDirection" min="0" max="359" value="0" step="1">
            </div>
            <details id="aeroDetails">
                <summary>Ball aerodynamics</summary>
                <label for="dragCrisis">
                    <input type="checkbox" id="dragCrisis" checked> Drag crisis
                    <span class="hint">(drag drops above the critical speed)</span>
                </label>
                <div id="dragCrisisControls">
                    <label for="criticalSpeed">Critical Speed: <span id="criticalSpeedValue" class="value-display">17.0 m/s</span></label>
                    <input type="range" id="criticalSpeed" min="12" max="25" value="17" step="0.5">
                </div>
                <label for="knuckleStrength">Knuckle Effect: <span id="knuckleStrengthValue" class="value-display">0.06</span>
                    <span class="hint">(side force without spin)</span></label>
                <input type="range" id="knuckleStrength" min="0" max="0.15" value="0.06" step="0.01">
            </details>
        </fieldset>

        <fieldset id="cameraFieldset">
            <legend>Camera</legend>
            <div class="camera-buttons">
                <button id="camBehind" title="Behind Server">Behind</button>
                <button id="camBaselineSide" title="Baseline Side">Baseline</button>
                <button id="camCourtSide" title="Court Side">Side</button>
                <button id="camTop" title="Top View">Top</button>
            </div>
            <div id="ballCamOption">
                <input type="checkbox" id="enableBallCam">
                <label for="enableBallCam">Ball's Eye</label>
            </div>
        </fieldset>

        <button id="serveButton">Serve!</button>

        <div id="results">
            <h3>Results</h3>
            <div class="grid">
                <p class="wide"><span>Classification:</span><span id="resultClassification" class="val">-</span></p>
                <p class="wide"><span id="resultSpeedLabel">Landing Speed:</span><span id="resultFinalSpeed" class="val">- m/s</span></p>
                <p><span>Flight Time:</span><span id="resultFlightTime" class="val">- s</span></p>
                <p><span>Difficulty:</span><span id="resultDifficulty" class="val">- / 100</span></p>
            </div>
        </div>

        <fieldset id="saveLoadFieldset" style="margin-top: auto;"> <!-- Push save/load towards bottom -->
            <legend>Save/Load Settings</legend>
            <div id="saveLoad">
                <!-- Save/Load slots will be generated here -->
            </div>
            <div id="saveStatus" role="status"></div>
        </fieldset>

        <div id="attribution" style="font-size: 0.7em; color: #666; padding-top: 6px; border-top: 1px solid #eee; line-height: 1.35;">
            Sand texture <a href="https://www.the3rdsequence.com/texturedb/texture/43/smooth+sand+dunes/" target="_blank" rel="noopener noreferrer">"Smooth sand dunes"</a>
            by the3rdSequence,
            <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>;
            resized to 1024×1024 and recompressed.
        </div>
    </div>

    <!-- Toggle Button (after #controls) -->
    <button id="toggleControlsButton" aria-label="Toggle Settings Panel" aria-expanded="true">
        ⚙️
    </button>
    <!-- Quick Serve Button (after #controls) -->
    <button id="quickServeButton" aria-label="Serve the ball">Serve</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            },
            "integrity": {
                "https://unpkg.com/three@0.160.0/build/three.module.js": "sha384-61S/Nu32S3E5+n+KpCOTb2eRYps6fVKm+9Gz1QBvSePFthb46f063Aa/qe/lykFZ",
                "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js": "sha384-qlO/ZugKPxAQUAvTlQoo0QECzxJIJySZmCF/DHdb2Xn/hHndFwX/vfUAC9Hbk6LP"
            }
        }
    </script>

    <script type="module" src="js/main.js"></script>
</body>
</html>
